"366" fill="#f5f5f5" font-size="12">• Avoidant/Restrictive Food Intake Disorder</text><text x="1214" y="382" fill="#f5f5f5" font-size="12">• Anorexia Nervosa</text><text x="1214" y="398" fill="#f5f5f5" font-size="12">• Bulimia Nervosa</text><text x="1214" y="414" fill="#f5f5f5" font-size="12">• Binge-Eating Disorder</text><text x="1214" y="430" fill="#f5f5f5" font-size="12">• Other / Unspecified Feeding or Eating Disorder</text></g><g><rect x="0" y="470" width="300" height="200" fill="#9ccc65"/><text x="14" y="496" fill="#fff" font-size="15" font-weight="700"><tspan x="14" dy="0">Elimination Disorders</tspan></text><text x="14" y="528" fill="#f5f5f5" font-size="12">• Enuresis</text><text x="14" y="544" fill="#f5f5f5" font-size="12">• Encopresis</text><text x="14" y="560" fill="#f5f5f5" font-size="12">• Other / Unspecified Elimination Disorder</text></g><g><rect x="300" y="470" width="300" height="200" fill="#66bb6a"/><text x="314" y="496" fill="#fff" font-size="15" font-weight="700"><tspan x="314" dy="0">Sleep-Wake Disorders</tspan></text><text x="314" y="528" fill="#f5f5f5" font-size="12">• Insomnia Disorder</text><text x="314" y="544" fill="#f5f5f5" font-size="12">• Hypersomnolence Disorder</text><text x="314" y="560" fill="#f5f5f5" font-size="12">• Narcolepsy</text><text x="314" y="576" fill="#f5f5f5" font-size="12">• Breathing-Related Sleep Disorders</text><text x="314" y="592" fill="#f5f5f5" font-size="12">• Circadian Rhythm Sleep-Wake Disorders</text><text x="314" y="608" fill="#f5f5f5" font-size="12">• Parasomnias</text><text x="314" y="624" fill="#f5f5f5" font-size="12">• Restless Legs Syndrome</text><text x="314" y="640" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Sleep Disorder</text><text x="314" y="656" fill="#eee" font-size="11">… +1 more</text></g><g><rect x="600" y="470" width="300" height="200" fill="#43a047"/><text x="614" y="496" fill="#fff" font-size="15" font-weight="700"><tspan x="614" dy="0">Sexual Dysfunctions</tspan></text><text x="614" y="528" fill="#f5f5f5" font-size="12">• Delayed Ejaculation</text><text x="614" y="544" fill="#f5f5f5" font-size="12">• Erectile Disorder</text><text x="614" y="560" fill="#f5f5f5" font-size="12">• Female Orgasmic Disorder</text><text x="614" y="576" fill="#f5f5f5" font-size="12">• Female Sexual Interest/Arousal Disorder</text><text x="614" y="592" fill="#f5f5f5" font-size="12">• Genito-Pelvic Pain/Penetration Disorder</text><text x="614" y="608" fill="#f5f5f5" font-size="12">• Male Hypoactive Sexual Desire Disorder</text><text x="614" y="624" fill="#f5f5f5" font-size="12">• Premature Ejaculation</text><text x="614" y="640" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Sexual Dysfunction</text><text x="614" y="656" fill="#eee" font-size="11">… +1 more</text></g><g><rect x="900" y="470" width="300" height="200" fill="#26a69a"/><text x="914" y="496" fill="#fff" font-size="15" font-weight="700"><tspan x="914" dy="0">Gender Dysphoria</tspan></text><text x="914" y="528" fill="#f5f5f5" font-size="12">• Gender Dysphoria</text><text x="914" y="544" fill="#f5f5f5" font-size="12">• Other / Unspecified Gender Dysphoria</text></g><g><rect x="1200" y="470" width="300" height="200" fill="#26c6da"/><text x="1214" y="496" fill="#fff" font-size="15" font-weight="700"><tspan x="1214" dy="0">Disruptive, Impulse-</tspan><tspan x="1214" dy="1.2em">Control &amp; Conduct</tspan><tspan x="1214" dy="1.2em">Disorders</tspan></text><text x="1214" y="540" fill="#f5f5f5" font-size="12">• Oppositional Defiant Disorder</text><text x="1214" y="556" fill="#f5f5f5" font-size="12">• Intermittent Explosive Disorder</text><text x="1214" y="572" fill="#f5f5f5" font-size="12">• Conduct Disorder</text><text x="1214" y="588" fill="#f5f5f5" font-size="12">• Antisocial Personality Disorder</text><text x="1214" y="604" fill="#f5f5f5" font-size="12">• Pyromania</text><text x="1214" y="620" fill="#f5f5f5" font-size="12">• Kleptomania</text><text x="1214" y="636" fill="#f5f5f5" font-size="12">• Other / Unspecified Disruptive Disorder</text></g><g><rect x="0" y="670" width="300" height="200" fill="#29b6f6"/><text x="14" y="696" fill="#fff" font-size="15" font-weight="700"><tspan x="14" dy="0">Substance-Related &amp;</tspan><tspan x="14" dy="1.2em">Addictive Disorders</tspan></text><text x="14" y="734" fill="#f5f5f5" font-size="12">• Alcohol-Related Disorders</text><text x="14" y="750" fill="#f5f5f5" font-size="12">• Caffeine-Related Disorders</text><text x="14" y="766" fill="#f5f5f5" font-size="12">• Cannabis-Related Disorders</text><text x="14" y="782" fill="#f5f5f5" font-size="12">• Hallucinogen-Related Disorders</text><text x="14" y="798" fill="#f5f5f5" font-size="12">• Inhalant-Related Disorders</text><text x="14" y="814" fill="#f5f5f5" font-size="12">• Opioid-Related Disorders</text><text x="14" y="830" fill="#f5f5f5" font-size="12">• Sedative-, Hypnotic-, or Anxiolytic-Related Disorders</text><text x="14" y="846" fill="#f5f5f5" font-size="12">• Stimulant-Related Disorders</text><text x="14" y="862" fill="#eee" font-size="11">… +3 more</text></g><g><rect x="300" y="670" width="300" height="200" fill="#42a5f5"/><text x="314" y="696" fill="#fff" font-size="15" font-weight="700"><tspan x="314" dy="0">Neurocognitive Disorders</tspan></text><text x="314" y="728" fill="#f5f5f5" font-size="12">• Delirium</text><text x="314" y="744" fill="#f5f5f5" font-size="12">• Major Neurocognitive Disorder</text><text x="314" y="760" fill="#f5f5f5" font-size="12">• Mild Neurocognitive Disorder</text><text x="314" y="776" fill="#f5f5f5" font-size="12">• Neurocognitive Disorder Due to Alzheimer’s Disease</text><text x="314" y="792" fill="#f5f5f5" font-size="12">• Neurocognitive Disorder Due to Other Etiologies</text><text x="314" y="808" fill="#f5f5f5" font-size="12">• Unspecified Neurocognitive Disorder</text></g><g><rect x="600" y="670" width="300" height="200" fill="#546e7a"/><text x="614" y="696" fill="#fff" font-size="15" font-weight="700"><tspan x="614" dy="0">Personality Disorders</tspan></text><text x="614" y="728" fill="#f5f5f5" font-size="12">• General Personality Disorder</text><text x="614" y="744" fill="#f5f5f5" font-size="12">• Cluster A Personality Disorders</text><text x="614" y="760" fill="#f5f5f5" font-size="12">• Cluster B Personality Disorders</text><text x="614" y="776" fill="#f5f5f5" font-size="12">• Cluster C Personality Disorders</text><text x="614" y="792" fill="#f5f5f5" font-size="12">• Other / Unspecified Personality Disorder</text></g><g><rect x="900" y="670" width="300" height="200" fill="#6d4c41"/><text x="914" y="696" fill="#fff" font-size="15" font-weight="700"><tspan x="914" dy="0">Paraphilic Disorders</tspan></text><text x="914" y="728" fill="#f5f5f5" font-size="12">• Voyeuristic Disorder</text><text x="914" y="744" fill="#f5f5f5" font-size="12">• Exhibitionistic Disorder</text><text x="914" y="760" fill="#f5f5f5" font-size="12">• Frotteuristic Disorder</text><text x="914" y="776" fill="#f5f5f5" font-size="12">• Sexual Masochism Disorder</text><text x="914" y="792" fill="#f5f5f5" font-size="12">• Sexual Sadism Disorder</text><text x="914" y="808" fill="#f5f5f5" font-size="12">• Pedophilic Disorder</text><text x="914" y="824" fill="#f5f5f5" font-size="12">• Fetishistic Disorder</text><text x="914" y="840" fill="#f5f5f5" font-size="12">• Transvestic Disorder</text><text x="914" y="856" fill="#eee" font-size="11">… +1 more</text></g><g><rect x="1200" y="670" width="300" height="200" fill="#8d6e63"/><text x="1214" y="696" fill="#fff" font-size="15" font-weight="700"><tspan x="1214" dy="0">Other Mental Disorders</tspan></text><text x="1214" y="728" fill="#f5f5f5" font-size="12">• Other Mental Disorder Due to Another Medical Condition</text><text x="1214" y="744" fill="#f5f5f5" font-size="12">• Other / Unspecified Mental Disorder</text></g></svg>
