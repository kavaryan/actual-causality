<text x="750.0" y="40" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">
Section II: Diagnostic Criteria and Codes
</text>
<g><rect x="0" y="70" width="300" height="200" fill="#1e88e5"/><text x="14" y="96" fill="#fff" font-size="15" font-weight="700"><tspan x="14" dy="0">Neurodevelopmental</tspan><tspan x="14" dy="1.2em">Disorders</tspan></text><text x="14" y="134" fill="#f5f5f5" font-size="12">• Intellectual Disabilities</text><text x="14" y="150" fill="#f5f5f5" font-size="12">• Communication Disorders</text><text x="14" y="166" fill="#f5f5f5" font-size="12">• Autism Spectrum Disorder</text><text x="14" y="182" fill="#f5f5f5" font-size="12">• Attention-Deficit/Hyperactivity Disorder</text><text x="14" y="198" fill="#f5f5f5" font-size="12">• Specific Learning Disorder</text><text x="14" y="214" fill="#f5f5f5" font-size="12">• Motor Disorders</text><text x="14" y="230" fill="#f5f5f5" font-size="12">• Tic Disorders</text><text x="14" y="246" fill="#f5f5f5" font-size="12">• Other Neurodevelopmental Disorders</text></g><g><rect x="300" y="70" width="300" height="200" fill="#3949ab"/><text x="314" y="96" fill="#fff" font-size="15" font-weight="700"><tspan x="314" dy="0">Schizophrenia Spectrum &amp;</tspan><tspan x="314" dy="1.2em">Other Psychotic</tspan><tspan x="314" dy="1.2em">Disorders</tspan></text><text x="314" y="140" fill="#f5f5f5" font-size="12">• Schizotypal Disorder</text><text x="314" y="156" fill="#f5f5f5" font-size="12">• Delusional Disorder</text><text x="314" y="172" fill="#f5f5f5" font-size="12">• Brief Psychotic Disorder</text><text x="314" y="188" fill="#f5f5f5" font-size="12">• Schizophreniform Disorder</text><text x="314" y="204" fill="#f5f5f5" font-size="12">• Schizophrenia</text><text x="314" y="220" fill="#f5f5f5" font-size="12">• Schizoaffective Disorder</text><text x="314" y="236" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Psychotic Disorder</text><text x="314" y="252" fill="#f5f5f5" font-size="12">• Psychotic Disorder Due to Another Medical Condition</text><text x="314" y="268" fill="#eee" font-size="11">… +1 more</text></g><g><rect x="600" y="70" width="300" height="200" fill="#5e35b1"/><text x="614" y="96" fill="#fff" font-size="15" font-weight="700"><tspan x="614" dy="0">Bipolar &amp; Related</tspan><tspan x="614" dy="1.2em">Disorders</tspan></text><text x="614" y="134" fill="#f5f5f5" font-size="12">• Bipolar I Disorder</text><text x="614" y="150" fill="#f5f5f5" font-size="12">• Bipolar II Disorder</text><text x="614" y="166" fill="#f5f5f5" font-size="12">• Cyclothymic Disorder</text><text x="614" y="182" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Bipolar Disorder</text><text x="614" y="198" fill="#f5f5f5" font-size="12">• Bipolar Disorder Due to Another Medical Condition</text><text x="614" y="214" fill="#f5f5f5" font-size="12">• Other / Unspecified Bipolar Disorder</text></g><g><rect x="900" y="70" width="300" height="200" fill="#7e57c2"/><text x="914" y="96" fill="#fff" font-size="15" font-weight="700"><tspan x="914" dy="0">Depressive Disorders</tspan></text><text x="914" y="128" fill="#f5f5f5" font-size="12">• Disruptive Mood Dysregulation Disorder</text><text x="914" y="144" fill="#f5f5f5" font-size="12">• Major Depressive Disorder</text><text x="914" y="160" fill="#f5f5f5" font-size="12">• Persistent Depressive Disorder (Dysthymia)</text><text x="914" y="176" fill="#f5f5f5" font-size="12">• Premenstrual Dysphoric Disorder</text><text x="914" y="192" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Depressive Disorder</text><text x="914" y="208" fill="#f5f5f5" font-size="12">• Depressive Disorder Due to Another Medical Condition</text><text x="914" y="224" fill="#f5f5f5" font-size="12">• Other / Unspecified Depressive Disorder</text></g><g><rect x="1200" y="70" width="300" height="200" fill="#8e24aa"/><text x="1214" y="96" fill="#fff" font-size="15" font-weight="700"><tspan x="1214" dy="0">Anxiety Disorders</tspan></text><text x="1214" y="128" fill="#f5f5f5" font-size="12">• Separation Anxiety Disorder</text><text x="1214" y="144" fill="#f5f5f5" font-size="12">• Selective Mutism</text><text x="1214" y="160" fill="#f5f5f5" font-size="12">• Specific Phobia</text><text x="1214" y="176" fill="#f5f5f5" font-size="12">• Social Anxiety Disorder</text><text x="1214" y="192" fill="#f5f5f5" font-size="12">• Panic Disorder</text><text x="1214" y="208" fill="#f5f5f5" font-size="12">• Agoraphobia</text><text x="1214" y="224" fill="#f5f5f5" font-size="12">• Generalized Anxiety Disorder</text><text x="1214" y="240" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced Anxiety Disorder</text><text x="1214" y="256" fill="#eee" font-size="11">… +1 more</text></g><g><rect x="0" y="270" width="300" height="200" fill="#c2185b"/><text x="14" y="296" fill="#fff" font-size="15" font-weight="700"><tspan x="14" dy="0">Obsessive-Compulsive &amp;</tspan><tspan x="14" dy="1.2em">Related Disorders</tspan></text><text x="14" y="334" fill="#f5f5f5" font-size="12">• Obsessive-Compulsive Disorder</text><text x="14" y="350" fill="#f5f5f5" font-size="12">• Body Dysmorphic Disorder</text><text x="14" y="366" fill="#f5f5f5" font-size="12">• Hoarding Disorder</text><text x="14" y="382" fill="#f5f5f5" font-size="12">• Trichotillomania</text><text x="14" y="398" fill="#f5f5f5" font-size="12">• Excoriation Disorder</text><text x="14" y="414" fill="#f5f5f5" font-size="12">• Substance/Medication-Induced OCD Disorder</text><text x="14" y="430" fill="#f5f5f5" font-size="12">• OCD Disorder Due to Another Medical Condition</text></g><g><rect x="300" y="270" width="300" height="200" fill="#e53935"/><text x="314" y="296" fill="#fff" font-size="15" font-weight="700"><tspan x="314" dy="0">Trauma- &amp; Stressor-</tspan><tspan x="314" dy="1.2em">Related Disorders</tspan></text><text x="314" y="334" fill="#f5f5f5" font-size="12">• Reactive Attachment Disorder</text><text x="314" y="350" fill="#f5f5f5" font-size="12">• Disinhibited Social Engagement Disorder</text><text x="314" y="366" fill="#f5f5f5" font-size="12">• Posttraumatic Stress Disorder</text><text x="314" y="382" fill=